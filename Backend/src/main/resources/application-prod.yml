# Production overrides. Swagger UI and verbose health details are
# turned off; everything else is still environment-variable driven.

springdoc:
  api-docs:
    enabled: false      # don't expose the OpenAPI schema publicly in prod
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.talentai: INFO
