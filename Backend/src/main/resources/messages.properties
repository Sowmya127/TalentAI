# Externalized user-facing messages (validation errors, API error
# bodies). Keyed here rather than hardcoded in exception classes so
# copy can change without a code change, and so multi-language
# support (BRD FR-COM-04) has a place to plug in later.

error.user.email.duplicate=A user with this email already exists.
error.user.not.found=User not found.

error.job.not.published=This job is not open for applications.
error.job.not.found=Job not found.

error.application.duplicate=You have already applied for this job.
error.application.not.found=Application not found.
error.application.screening.incomplete=This candidate does not satisfy all mandatory screening criteria.

error.interview.not.eligible=Candidate is not in an interview-eligible stage.

error.offer.not.selected=An offer can only be created for a selected candidate.
error.offer.already.exists=An offer already exists for this application.

error.validation.failed=One or more fields failed validation.
error.unauthorized=You are not authorized to perform this action.
