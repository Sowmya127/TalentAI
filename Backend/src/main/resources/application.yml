# =====================================================================
# TalentAI - base configuration.
# Every value that changes across environments is read from an
# environment variable. This file should be identical in every
# environment; only application-{profile}.yml files should differ.
# =====================================================================

spring:
  application:
    name: talentai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:talentai}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Sized for concurrency; still env-overridable per environment/instance. Keep the
      # DB's max_connections >= (pool size x app instances) when scaling horizontally.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    # Schema is owned entirely by Flyway migrations -- Hibernate must
    # never create/alter tables itself in any environment.
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      # Bound resume uploads so an oversized file can't exhaust memory/disk (env-tunable).
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:15MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  # Let in-flight requests finish on SIGTERM (deploys / scale-in) instead of dropping them.
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}

# Brute-force protection on the login endpoint (per client IP, fixed window).
security:
  login:
    rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-attempts: ${LOGIN_RATE_LIMIT_MAX:10}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

ai:
  provider-base-url: ${AI_PROVIDER_BASE_URL}
  api-key: ${OPENAI_API_KEY}
  model: ${AI_MODEL:gpt-4o-mini}
  request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:30000}
  # Amazon Bedrock (managed LLMs). Off by default so the app runs fully on the
  # deterministic heuristic; flip BEDROCK_ENABLED=true on a host whose IAM role
  # grants bedrock:InvokeModel. Credentials come from the default AWS chain
  # (EC2 instance role in prod) — never put AWS keys in config.
  bedrock:
    enabled: ${BEDROCK_ENABLED:false}
    region: ${BEDROCK_REGION:ap-south-1}
    model-id: ${BEDROCK_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}
    max-tokens: ${BEDROCK_MAX_TOKENS:1024}
    timeout-ms: ${BEDROCK_TIMEOUT_MS:20000}

storage:
  resume-upload-path: ${FILE_UPLOAD_PATH:/var/talentai/uploads/resumes}
  max-file-size-mb: ${FILE_MAX_SIZE_MB:10}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:when-authorized}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.talentai: ${LOG_LEVEL_APP:INFO}
