# Automated test profile. Real projects typically point this at a
# Testcontainers-managed MySQL instance rather than a shared database --
# see src/test/java/.../IntegrationTestBase for the container wiring
# once tests are added.

spring:
  jpa:
    show-sql: false

# The suite fires many logins from 127.0.0.1; leave brute-force limiting off here
# (it has its own dedicated unit test).
security:
  login:
    rate-limit:
      enabled: false

logging:
  level:
    root: WARN
    com.talentai: INFO
