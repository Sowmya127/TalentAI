name: CI/CD — build, test, deploy to EC2

# Full pipeline: on every push to main it runs the tests, and only if they pass
# builds the JAR + React bundle and deploys them to the EC2 instance, then
# restarts the backend. Manual runs are allowed via the "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1) CI — unit tests + frontend type-check/build. No database needed (the unit
  #    tests are mocked; the *IT integration tests are run separately).
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend unit tests
        working-directory: Backend
        run: mvn -B test

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Frontend type-check + build
        working-directory: Frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # 2) CD — build the release artifacts and ship them to the EC2 box.
  #    Runs only after `test` succeeds, and only on main.
  # ---------------------------------------------------------------------------
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend JAR
        working-directory: Backend
        run: mvn -B clean package -DskipTests

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Build frontend
        working-directory: Frontend
        run: |
          npm ci
          npm run build

      - name: Package release (one tarball = jar + web build)
        run: |
          mkdir -p stage/web
          cp Backend/target/talentai-backend-*.jar stage/app.jar
          cp -r Frontend/dist/* stage/web/
          tar czf deploy.tgz -C stage .

      - name: Copy release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy.tgz
          target: /tmp

      - name: Deploy on EC2 (place files + restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            rm -rf /tmp/stage && mkdir -p /tmp/stage
            tar xzf /tmp/deploy.tgz -C /tmp/stage
            sudo mv /tmp/stage/app.jar /opt/talentai/app.jar
            sudo chown talentai:talentai /opt/talentai/app.jar
            sudo rm -rf /var/www/talentai/*
            sudo cp -r /tmp/stage/web/* /var/www/talentai/
            sudo systemctl restart talentai
            rm -rf /tmp/stage /tmp/deploy.tgz
            sleep 30
            curl -fsS http://localhost/api/actuator/health && echo " <- deploy OK"
