name: CI

# Build, test (unit + integration via Testcontainers) and run SonarQube analysis.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, test & SonarQube
    runs-on: ubuntu-latest
    env:
      # Set these in the repo:  Settings -> Secrets and variables -> Actions
      #   Secrets:   SONAR_TOKEN (required to run analysis), SONAR_HOST_URL (self-hosted only)
      #   Variables: SONAR_PROJECT_KEY, SONAR_ORGANIZATION (SonarCloud only)
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Sonar can attribute issues via git blame

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Ubuntu runners include Docker, so the -Pit profile runs the *IT suite
      # against a MySQL Testcontainer and JaCoCo covers it too.
      - name: Build, test & coverage
        working-directory: Backend
        run: mvn -B -Pit verify

      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        working-directory: Backend
        run: |
          ARGS="-Dsonar.host.url=${SONAR_HOST_URL:-https://sonarcloud.io}"
          ARGS="$ARGS -Dsonar.token=${SONAR_TOKEN}"
          ARGS="$ARGS -Dsonar.projectKey=${SONAR_PROJECT_KEY:-TalentAI}"
          if [ -n "$SONAR_ORG" ]; then ARGS="$ARGS -Dsonar.organization=$SONAR_ORG"; fi
          mvn -B sonar:sonar $ARGS
