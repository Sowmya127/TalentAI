# =====================================================================
# nginx.conf — production-grade load balancer for the TalentAI cluster.
#
# Use this instead of the bundled Java balancer when you want the real thing.
# Install nginx (once):   winget install nginx
# Run with this config:   nginx -c D:\TalentAI\cluster\nginx.conf
# Reload after edits:     nginx -s reload      Stop: nginx -s stop
#
# Keep this in sync with the instances start-cluster.ps1 launches
# (default 8081, 8082 — add a line per extra instance).
# =====================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    upstream talentai_backend {
        # least_conn sends each request to the instance with the fewest active
        # connections — better than round-robin when request cost varies.
        least_conn;

        # Passive health checks (nginx OSS): after 3 failures within 10s the
        # instance is taken out of rotation for 10s, then retried.
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
        # server 127.0.0.1:8083 max_fails=3 fail_timeout=10s;   # uncomment to scale out
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Everything (the app serves under context-path /api) goes to the cluster.
        location / {
            proxy_pass         http://talentai_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Retry the next instance if one is down / errors mid-request.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;

            # Surface which instance served the response (mirrors the Java LB).
            add_header X-LB-Upstream $upstream_addr always;
        }
    }
}
